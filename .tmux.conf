set -g default-shell $shell_path

# Prefix is C-s locally and C-a on hosts reached over ssh, so when a remote tmux is nested
# inside the local one each layer has its own prefix instead of both grabbing the same key.
# Quoted-string form (not {} blocks) so this still parses on old cluster tmux versions.
unbind C-b
if-shell '[ -n "$SSH_CONNECTION" ]' \
  'set -g prefix C-a; bind C-a send-prefix' \
  'set -g prefix C-s; bind C-s send-prefix'

# Name windows running ssh (or autossh, via ash) after the remote host instead of "ssh". The
# ssh/ash shell functions title the pane with the destination before connecting, and the remote
# side then reports its short hostname (set-titles below for a remote tmux, an OSC 2 in bashrc
# for a bare shell); either lands in pane_title here. If pane_title is still the local
# hostname, fall back to the command name. Claude Code's process name
# is its version number (e.g. 2.1.4), so a command shaped like a version is shown as "claude".
# Otherwise this is tmux's default format.
set -g automatic-rename-format \
  '#{?pane_in_mode,[tmux],#{?#{&&:#{m:*ssh,#{pane_current_command}},#{!=:#{pane_title},#{host}}},#{pane_title},#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},claude,#{pane_current_command}}}}#{?pane_dead,[dead],}'
if-shell '[ -n "$SSH_CONNECTION" ]' 'set -g set-titles on; set -g set-titles-string "#h"'

# Vim style moving around windows
set-window-option -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Splits open in the current pane's directory instead of the session's start directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g mouse on
set -g history-limit 50000

# Smoother mouse-wheel scrolling: tmux defaults to 5 lines per tick, which
# feels jumpy. Scroll 1 line per tick instead.
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind -T copy-mode WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# Forward terminal focus in/out events to the pane's program (e.g. lets
# Claude Code know whether its pane is focused, for desktop notifications)
set -g focus-events on

set -sg escape-time 10

# Refresh VS Code's git credential helper vars on attach, so git in a pane
# reattached from a new VS Code window doesn't use a stale IPC socket
set -ga update-environment " VSCODE_GIT_IPC_HANDLE GIT_ASKPASS VSCODE_GIT_ASKPASS_NODE VSCODE_GIT_ASKPASS_MAIN VSCODE_GIT_ASKPASS_EXTRA_ARGS"

# osc52 clipboard stuff
set -s set-clipboard on
set -as terminal-features ',alacritty:clipboard'

# Catppuccin Mocha, to match the ble.sh/starship shell theme
set -g @catppuccin_flavor 'mocha'
# A solid bar the window blocks merge into, instead of near-terminal-black mantle with floating pills
set -g @catppuccin_status_background "#{@thm_surface_0}"
# Label windows by name (#W) instead of pane title (#T), which defaults to the full hostname
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
# nf-fa-terminal (>_ without the box) for the session pill; needs a Nerd Font in the local terminal
set -g @catppuccin_session_icon " "
run '$dotfiles_dir/tmux/vendor/catppuccin/catppuccin.tmux'
# tmux 3.7 draws the command prompt and messages on top of the status line, and catppuccin's
# centred, unfilled message style lets the bar's pills show through around the prompt. Fill the
# whole line and left-align so the prompt replaces the bar while it's open.
%if "#{>=:#{version},3.2}"
  set -gF message-style "fg=#{@thm_teal},bg=#{@thm_surface_0},fill=#{@thm_surface_0},align=left"
  set -gF message-command-style "fg=#{@thm_teal},bg=#{@thm_surface_0},fill=#{@thm_surface_0},align=left"
%endif
# Session name as a catppuccin pill (turns red while the prefix is held) instead of the plain "[name]" default
set -g status-left "#{E:@catppuccin_status_session} "
# No gap between window blocks, so they read as one connected bar
set -g window-status-separator ""
# Default status-left-length (10) truncates longer session names
set -g status-left-length 40
# Short hostname only (the default shows the pane title plus clock and date), as a
# pill mirroring the session one: hostname, then the icon block with its rounded cap
# on the outer edge. Hand-built because catppuccin modules always put the icon first.
# Blue so it doesn't match the mauve current-window number.
# On ssh hosts the pill is peach with a server icon (\U000F048B, nf-md-server) and the bar sits at
# the bottom; locally it is a laptop icon (\U000F0322, nf-md-laptop) and the bar sits at the top.
# That makes it obvious which layer is which when a remote tmux is nested in the local one.
if-shell '[ -n "$SSH_CONNECTION" ]' \
  'set -g @host_color "#{@thm_peach}"; set -g @host_icon "\U000F048B"; set -g status-position bottom' \
  'set -g @host_color "#{@thm_blue}"; set -g @host_icon "\U000F0322"; set -g status-position top'
set -g status-right "#[fg=#{@thm_fg}]#h #[fg=#{@thm_crust},bg=#{E:@host_color}] #{@host_icon}#[fg=#{E:@host_color},bg=#{@thm_surface_0}]"

# tmux-fzf: fuzzy switch/manage sessions, windows, panes (prefix + F)
run '$dotfiles_dir/tmux/vendor/tmux-fzf/main.tmux'
