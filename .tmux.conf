set -g default-shell $shell_path

# Rebind C-b to C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Vim style moving around windows
set-window-option -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g mouse on
set -g history-limit 50000

# Smoother mouse-wheel scrolling: tmux defaults to 5 lines per tick, which
# feels jumpy. Scroll 1 line per tick instead.
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind -T copy-mode WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# Forward terminal focus in/out events to the pane's program (e.g. lets
# Claude Code know whether its pane is focused, for desktop notifications)
set -g focus-events on

set -sg escape-time 10

# osc52 clipboard stuff
set -s set-clipboard on
set -as terminal-features ',alacritty:clipboard'

# Catppuccin Mocha, to match the ble.sh/starship shell theme
set -g @catppuccin_flavor 'mocha'
# Label windows by name (#W) instead of pane title (#T), which defaults to the full hostname
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
run '$dotfiles_dir/tmux/vendor/catppuccin/catppuccin.tmux'
# Default status-left-length (10) truncates longer session names
set -g status-left-length 40
# Short hostname only: the default shows the pane title (set by whatever runs in the pane) plus clock and date
set -g status-right "#h"

# tmux-fzf: fuzzy switch/manage sessions, windows, panes (prefix + F)
run '$dotfiles_dir/tmux/vendor/tmux-fzf/main.tmux'
